[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "crossing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "av",
    "sounddevice",
    "paddleocr>=3.2",
    "numpy",
    "Pillow",
    "ultralytics",
    "scipy",
    "torchreid",
    "gdown",
    "tensorboard",
    "mcp[cli]>=1.27.0",
]

[project.optional-dependencies]
annotate = [
  "transformers>=5.0.0",
  "huggingface-hub>=0.15.0",
  "safetensors",
  "accelerate",
]
visualizer = [
  "PyQt5",
  "opencv-python-headless",
]
shot-detection = [
  "TransNetV2 @ git+https://github.com/soCzech/TransNetV2.git",
  "tensorflow>=2.5",
  "ffmpeg-python",
]
silhouette = [
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
  "opencv-python-headless",
]
all = [
  "crossing[annotate,visualizer,shot-detection,silhouette]",
]

[project.scripts]
crossing = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
